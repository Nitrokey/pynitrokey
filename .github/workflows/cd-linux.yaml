name: Continuous delivery - Linux

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  POETRY_SPEC: poetry >=2,<3

jobs:
  check-version-tag:
    name: Check version tag
    runs-on: ubuntu-latest
    container: python:3.10-slim
    if: github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dependencies
        run: pip install toml-cli
      - name: Check version tag
        shell: bash
        run: |
          PYPROJECT_VERSION="v$(toml get --toml-path pyproject.toml project.version)"
          TAG_VERSION="${{ github.event.release.tag_name }}"
          if [ $PYPROJECT_VERSION == $TAG_VERSION ]; then exit 0; else exit 1; fi
  build-onefile:
    name: Build onefile
    runs-on: ubuntu-latest
    container: python:3.10-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install required packages
        run: |
          apt update
          apt install -y binutils gcc git libpcsclite-dev libusb-1.0-0 make swig
      - name: Install poetry
        run: pip install "${POETRY_SPEC}"
      - name: Create virtual environment
        run: poetry sync --all-extras --with pyinstaller
      - name: Build
        run: poetry run pyinstaller -- ci-scripts/pyinstaller.spec -- --mode onefile --platform linux
      - name: Test onefile
        run: |
            dist/nitropy --help
            dist/nitropy version
            dist/nitropy nethsm --host nethsmdemo.nitrokey.com state
            dist/nitropy list
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nitropy-onefile
          path: dist/nitropy
  publish-binary:
    name: Publish binary
    runs-on: ubuntu-latest
    container: python:3.10-slim
    needs: [build-onefile, check-version-tag]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: nitropy-onefile
      - name: Rename binary
        run: |
          mv \
            nitropy \
            nitropy-${{ github.event.release.tag_name }}-x64-linux-binary
      - name: Create archive
        run: |
          tar \
          -czvf \
          nitropy-${{ github.event.release.tag_name }}-x64-linux-binary.tar.gz \
          nitropy-${{ github.event.release.tag_name }}-x64-linux-binary
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: nitropy-${{ github.event.release.tag_name }}-x64-linux-binary.tar.gz
